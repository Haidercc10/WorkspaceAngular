<div class="fondo">
  <form [formGroup]="formularioUsuario" (ngSubmit)="validarCamposVacios()">

    <!--<div class="titulo">
      <img class="logo slide-in-fwd-center" src="/assets/PLASTICARIBE_logo.png" alt="">
    </div>-->

    <!--Contenedor Principal-->
    <div class="container-fluid slide-in-fwd-center">
      <div [ngClass]="{'contenedorLoginLigth' : !modoSeleccionado, 'contenedorLoginDark' : modoSeleccionado}" >

        <!--Verificación de conexión: logo animado + estado, antes de mostrar el formulario-->
        <div *ngIf="estadoConexion != 'listo'" class="verificacionConexion">
          <img class="logoCarga" [class.logoCargaError]="estadoConexion == 'error'"
               [src]="!modoSeleccionado ? 'assets/PlasticaribeNewLogo2.png' : 'assets/PlasticaribeNewLogoWhite.png'" alt="Plasticaribe">
          <!--Distintivo BETA: late junto al logo mientras verifica y se atenúa igual que él si hay error-->
          <span *ngIf="esBeta" class="badgeBeta badgeBetaCarga" [class.badgeBetaError]="estadoConexion == 'error'" title="Entorno de pruebas">BETA</span>
          <p *ngIf="estadoConexion == 'verificando'" class="mensajeConexion">{{ mensajeConexion }}</p>
          <ul *ngIf="estadoConexion == 'error'" class="erroresConexion">
            <li *ngFor="let error of erroresConexion" [title]="error">
              <i class="pi pi-exclamation-triangle"></i>
              <span>{{ error }}</span>
            </li>
          </ul>
          <button *ngIf="estadoConexion == 'error'" pButton pRipple type="button" icon="pi pi-refresh" label="Reintentar"
                  class="p-button-danger p-button-text" (click)="recargarPagina()"></button>
        </div>

        <div *ngIf="estadoConexion == 'listo'" class="aparecer">
        <!--Titulo-->
        <div class="mb-3">
          <h4 class="tituloRojo"><i class="pi pi-sign-in"></i> Accede a tu cuenta de</h4>
          <img class="logo2" [src]="!modoSeleccionado ? 'assets/PlasticaribeNewLogo2.png' : 'assets/PlasticaribeNewLogoWhite.png'" alt="">
          <!--Distintivo BETA: aparece con el formulario (animación .aparecer del contenedor)-->
          <div *ngIf="esBeta" class="betaLogin">
            <span class="badgeBeta" title="Entorno de pruebas">BETA</span>
          </div>
        </div>

        <div class="col-md mb">
          <span class="p-input-icon-left p-float-label">
            <i class="pi pi-user"></i>
            <input formControlName="Identificacion" autocomplete="username" name="username" placeholder="ID Usuario" id="usuario" pInputText required/>
            <label for="usuario">Usuario</label>
          </span>
        </div>

        <div class="col-md mb">
          <span class="p-input-icon-left p-float-label">
            <i class="pi pi-key"></i>
            <p-password formControlName="Contrasena" [feedback]="false" inputId="pass" autocomplete="current-password" [toggleMask]="true"></p-password>
            <label for="pass">Contraseña</label>
          </span>
        </div>

        <!--Empresa: oculta, se deja escogida automáticamente (PLASTICARIBE S.A.S) al verificar la conexión-->

        <div class="recordarme">
          <p-checkbox formControlName="Recordarme" [binary]="true" inputId="recordarme"></p-checkbox>
          <label for="recordarme">Recuérdame</label>
        </div>

        <!--Boton Ingresar al sistema-->
        <div class="d-grid gap-2 mb-3">
          <button pButton pRipple label="Ingresar" type="submit" icon="pi pi-check" class="p-button-danger"></button>
        </div>

        <!--Boton Ingresar como invitado-->
        <div class="mb-3">
          <button pButton pRipple type="button" icon="pi pi-users" label="Entrar como invitado" class="p-button-danger p-button-text" (click)="redireccionarArchivos()"></button>
        </div>
        </div>

        <!--Versión de la app (package.json): visible tanto en la verificación de conexión como en el formulario-->
        <p class="versionApp" [ngClass]="{'versionAppDark' : modoSeleccionado}">v{{ versionApp }}</p>
      </div>
    </div>
  </form>

  <div class="d-flex justify-content-center overlay" *ngIf="cargando">
    <div style="margin: auto;">
      <p-progressSpinner></p-progressSpinner>
    </div>
  </div>
</div>
