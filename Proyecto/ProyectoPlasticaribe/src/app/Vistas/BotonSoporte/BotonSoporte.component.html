<ng-container *ngIf="visible">
  <!-- Botón flotante: ayuda a 1.5 s (regla de tooltips de ayuda) -->
  <button type="button" class="boton-soporte" (click)="abrirPanel()" *ngIf="!panelVisible"
          pTooltip="Reportar incidente a soporte" tooltipPosition="left" [showDelay]="1500"
          aria-label="Reportar incidente a soporte">
    <i class="pi pi-ticket boton-soporte-icono" aria-hidden="true"></i>
    <span class="boton-soporte-mas" aria-hidden="true"><i class="pi pi-plus"></i></span>
  </button>

  <!-- Panel lateral sin máscara: la página sigue a la vista. Se cierra con la X o con Esc, no con un clic afuera,
       para no perder lo escrito por un clic accidental (y lo escrito se conserva aunque se cierre). -->
  <p-sidebar [(visible)]="panelVisible" position="right" [modal]="false" [dismissible]="false" [closeOnEscape]="true"
             [blockScroll]="false" styleClass="panel-soporte">
    <ng-template pTemplate="header">
      <span class="panel-soporte-titulo"><i class="pi pi-ticket"></i> Reportar a soporte</span>
    </ng-template>
    <app-formulario-ticket *ngIf="formularioMontado" [compacto]="true" [paginaOrigen]="paginaActual"
                           [pegadoActivo]="panelVisible" (creado)="alCrearTicket($event)"></app-formulario-ticket>
  </p-sidebar>
</ng-container>

<!-- Aviso de ticket creado (fuera del *ngIf: sigue visible aunque se navegue a una página sin botón) -->
<p-toast [key]="claveToast" position="center" [breakpoints]="{'920px': {width: '100%', right: '0', left: '0'}}">
  <ng-template let-message pTemplate="message">
    <div class="toast-ticket">
      <i class="pi pi-check-circle toast-ticket-icono"></i>
      <div class="toast-ticket-texto">
        <div class="toast-ticket-titulo">{{message.summary}}</div>
        <div>{{message.detail}}</div>
        <button pButton type="button" class="p-button-sm p-button-success mt-2" icon="pi pi-list" label="VER MIS TICKETS" (click)="verMisTickets()"></button>
      </div>
    </div>
  </ng-template>
</p-toast>
